# Local development stack for the Interior Specifics WordPress build.
#   docker compose up -d      → WordPress on http://localhost:${WP_PORT:-8090}, Mailpit on http://localhost:8025
#   bash bin/setup.sh         → install WordPress, activate theme/plugin, seed content
name: interior-specifics

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8090}:80"
    environment: &wp_env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: "1"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', '/tmp/wp-debug.log' ); // Outside the web root: never downloadable.
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'IS_SMTP_HOST', 'mailpit' );
        define( 'IS_SMTP_PORT', 1025 );
        if ( getenv( 'RESEND_API_KEY' ) ) { define( 'RESEND_API_KEY', getenv( 'RESEND_API_KEY' ) ); }
    volumes: &wp_volumes
      - wp_data:/var/www/html
      - ./themes/interior-specifics:/var/www/html/wp-content/themes/interior-specifics
      - ./plugins/interior-specifics-core:/var/www/html/wp-content/plugins/interior-specifics-core
      - ./seed:/seed:ro

  wpcli:
    image: wordpress:cli-php8.3
    # Match the Debian www-data uid of the wordpress image so files stay writable.
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      <<: *wp_env
      HOME: /tmp
    volumes: *wp_volumes
    profiles: ["cli"]
    entrypoint: ["wp"]

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  db_data:
  wp_data:
